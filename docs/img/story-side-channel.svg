<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 428' width='760' height='428' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><rect width='760' height='428' fill='#fff'/><defs><marker id='b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a9a69c'/></marker></defs><text x='24' y='30' font-size='15' font-weight='600' fill='#1f1f1f' text-anchor='start'>Alice leaves a trace in the shared cache that Eve can detect</text><rect x='248' y='60' width='264' height='344' rx='8' fill='#f1f0ec' stroke='#a9a69c'/><text x='264' y='86' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Shared SGLang server</text><rect x='264' y='100' width='232' height='88' rx='8' fill='none' fill-opacity='1' stroke='#a9a69c' stroke-width='1.25'/><text x='276' y='124' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Shared prefix cache</text><text x='276' y='144' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>Acme instructions</text><text x='276' y='160' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>+ My account number is 877893...</text><text x='276' y='176' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>kept after Alice&#8217;s reply</text><text x='264' y='236' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>Eve&#8217;s probe matches Alice&#8217;s entry</text><text x='264' y='252' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>one token further than a wrong digit,</text><text x='264' y='268' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>so less of it needs prefill</text><rect x='24' y='88' width='160' height='88' rx='8' fill='none' fill-opacity='1' stroke='#a9a69c' stroke-width='1.25'/><text x='36' y='112' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Alice sends</text><text x='36' y='132' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>My account number is</text><text x='36' y='148' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>877893. Please check</text><text x='36' y='164' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>my balance.</text><rect x='568' y='210' width='168' height='56' rx='8' fill='none' fill-opacity='1' stroke='#a9a69c' stroke-width='1.25'/><text x='580' y='234' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Eve probes</text><text x='580' y='254' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>My account number is 8</text><rect x='568' y='300' width='168' height='88' rx='8' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6' stroke-width='2'/><text x='580' y='324' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Reply to Eve</text><text x='580' y='344' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='start'>cached_tokens: 39</text><text x='580' y='360' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='start'>every other digit: 38</text><text x='580' y='376' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='start'>and it arrives sooner</text><g fill='none' stroke='#a9a69c' stroke-width='1.25'><path d='M184 132H262' marker-end='url(#b)'/><path d='M568 238H514' marker-end='url(#b)'/><path d='M512 344H566' marker-end='url(#b)'/></g><text x='216' y='124' font-size='11.5' font-weight='600' fill='#5f5e5a' text-anchor='middle'>1</text><text x='540' y='230' font-size='11.5' font-weight='600' fill='#5f5e5a' text-anchor='middle'>2</text><text x='540' y='336' font-size='11.5' font-weight='600' fill='#5f5e5a' text-anchor='middle'>3</text></svg>
