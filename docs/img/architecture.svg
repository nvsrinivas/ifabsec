<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 440' width='760' height='440' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><rect width='760' height='440' fill='#ffffff'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a9a69c'/></marker></defs><text x='24' y='32' font-size='15' font-weight='600' fill='#1f1f1f' text-anchor='start'>The gateway decides what is shared; the engine enforces it in cache keys</text><rect x='24' y='52' width='712' height='144' rx='8' fill='#f1f0ec' stroke='#a9a69c'/><text x='40' y='76' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Zero-trust edge: decides</text><rect x='24' y='248' width='712' height='168' rx='8' fill='#f1f0ec' stroke='#a9a69c'/><text x='720' y='272' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='end'>SGLang server with the ifabsec patch: enforces</text><text x='40' y='400' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>Fail closed: a request with no valid label gets a private cache space and shares nothing.</text><g fill='none' stroke='#a9a69c' stroke-width='1.25'><path d='M244 136.0H284' marker-end='url(#ar)'/><path d='M476 136.0H516' marker-end='url(#ar)'/><path d='M612.0 180V224H148.0V288' marker-end='url(#ar)'/><path d='M244 332.0H284' marker-end='url(#ar)'/><path d='M476 332.0H516' marker-end='url(#ar)'/></g><text x='380' y='216' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>chat request + signed label token</text><rect x='52' y='92' width='192' height='88' rx='8' fill='#ffffff' fill-opacity='1' stroke='#a9a69c' stroke-width='1.25'/><text x='64' y='116' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>User or agent</text><text x='64' y='136' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>Sends chat messages</text><text x='64' y='152' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>through the tunnel</text><rect x='284' y='92' width='192' height='88' rx='8' fill='#ffffff' fill-opacity='1' stroke='#a9a69c' stroke-width='1.25'/><text x='296' y='116' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Zero-trust tunnel</text><text x='296' y='136' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>WireGuard; authenticates</text><text x='296' y='152' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>the user or agent</text><rect x='516' y='92' width='192' height='88' rx='8' fill='#ffffff' fill-opacity='1' stroke='#a9a69c' stroke-width='1.25'/><text x='528' y='116' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Policy gateway</text><text x='528' y='136' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>Signs a short-lived label</text><text x='528' y='152' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>token: scope per message,</text><text x='528' y='168' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>hash of approved text</text><rect x='52' y='288' width='192' height='88' rx='8' fill='#ffffff' fill-opacity='1' stroke='#a9a69c' stroke-width='1.25'/><text x='64' y='312' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>HTTP process</text><text x='64' y='332' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>Checks signature, expiry</text><text x='64' y='348' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>and replay; maps segments</text><text x='64' y='364' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>to token boundaries</text><rect x='284' y='288' width='192' height='88' rx='8' fill='#ffffff' fill-opacity='1' stroke='#a9a69c' stroke-width='1.25'/><text x='296' y='312' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Scheduler</text><text x='296' y='332' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>Unseals an internal salt</text><text x='296' y='348' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>bound to the input tokens</text><text x='296' y='364' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>and builds scoped keys</text><rect x='516' y='288' width='192' height='88' rx='8' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6' stroke-width='2'/><text x='528' y='312' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Radix prefix cache</text><text x='528' y='332' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='start'>Keys are (scope, token),</text><text x='528' y='348' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='start'>so a match never crosses</text><text x='528' y='364' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='start'>a scope boundary</text></svg>
