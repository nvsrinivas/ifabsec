<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 312' width='760' height='312' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><rect width='760' height='312' fill='#ffffff'/><text x='24' y='32' font-size='15' font-weight='600' fill='#1f1f1f' text-anchor='start'>With labels, the company instructions are shared and personal messages are not</text><text x='24' y='84' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Every chat has two parts</text><text x='24' y='100' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>each stamped with who may reuse it</text><rect x='216' y='64' width='272' height='48' rx='8' fill='#f1f0ec' stroke='#a9a69c' stroke-width='1.25'/><text x='352' y='84' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='middle'>Company instructions</text><text x='352' y='100' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>stamped: everyone at Acme</text><rect x='496' y='64' width='240' height='48' rx='8' fill='#f1f0ec' stroke='#a9a69c' stroke-width='1.25'/><text x='616' y='84' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='middle'>Your own messages</text><text x='616' y='100' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>stamped: only you</text><line x1='24' x2='736' y1='124' y2='124' stroke='#e3e1dc'/><text x='24' y='153' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Alice</text><text x='24' y='169' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>asks the same thing again</text><rect x='216' y='136' width='272' height='40' rx='8' fill='#1f9d3a' fill-opacity='0.16' stroke='#1f9d3a' stroke-width='1.25'/><rect x='496' y='136' width='240' height='40' rx='8' fill='#1f9d3a' fill-opacity='0.16' stroke='#1f9d3a' stroke-width='1.25'/><text x='352' y='160' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>reused</text><text x='616' y='160' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>reused</text><text x='24' y='209' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Eve</text><text x='24' y='225' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>Acme, types Alice&#8217;s words</text><rect x='216' y='192' width='272' height='40' rx='8' fill='#1f9d3a' fill-opacity='0.16' stroke='#1f9d3a' stroke-width='1.25'/><rect x='496' y='192' width='240' height='40' rx='8' fill='none' stroke='#a9a69c' stroke-width='1.25' stroke-dasharray='4 4'/><text x='352' y='216' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>reused</text><text x='616' y='216' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>computed fresh</text><text x='24' y='265' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Dan</text><text x='24' y='281' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>another company</text><rect x='216' y='248' width='272' height='40' rx='8' fill='none' stroke='#a9a69c' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='496' y='248' width='240' height='40' rx='8' fill='none' stroke='#a9a69c' stroke-width='1.25' stroke-dasharray='4 4'/><text x='352' y='272' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>computed fresh</text><text x='616' y='272' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>computed fresh</text></svg>
