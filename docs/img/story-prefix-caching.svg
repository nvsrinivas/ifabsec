<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 364' width='760' height='364' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><rect width='760' height='364' fill='#fff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a9a69c'/></marker></defs><text x='24' y='30' font-size='15' font-weight='600' fill='#1f1f1f' text-anchor='start'>Prefix caching skips prefill for the shared opening of a prompt</text><text x='396.0' y='92' font-size='11.5' font-weight='600' fill='#5f5e5a' text-anchor='middle'>prefill: read the prompt, build its KV cache</text><line x1='192' x2='600' y1='100' y2='100' stroke='#a9a69c'/><text x='692.0' y='92' font-size='11.5' font-weight='600' fill='#5f5e5a' text-anchor='middle'>decode</text><line x1='648' x2='736' y1='100' y2='100' stroke='#a9a69c'/><text x='24' y='129' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Request 1</text><text x='24' y='145' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>cache is empty</text><rect x='192' y='112' width='240' height='40' rx='6' fill='#c4c2b8' fill-opacity='0.35' stroke='#a9a69c'/><text x='312.0' y='137' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>Company instructions</text><rect x='440' y='112' width='160' height='40' rx='6' fill='#c4c2b8' fill-opacity='0.35' stroke='#a9a69c'/><text x='520.0' y='137' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>Alice&#8217;s question</text><path d='M608 132.0H644' stroke='#a9a69c' stroke-width='1.25' fill='none' marker-end='url(#a)'/><rect x='648' y='112' width='88' height='40' rx='6' fill='none' stroke='#a9a69c' stroke-width='1.25' stroke-dasharray='4 3'/><text x='692.0' y='137' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>reply</text><text x='24' y='197' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Request 2</text><text x='24' y='213' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>same opening</text><rect x='192' y='180' width='240' height='40' rx='6' fill='#1f9d3a' fill-opacity='0.16' stroke='#1f9d3a' stroke-width='1.25'/><text x='312.0' y='205' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>Company instructions</text><rect x='440' y='180' width='160' height='40' rx='6' fill='#c4c2b8' fill-opacity='0.35' stroke='#a9a69c'/><text x='520.0' y='205' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>Bob&#8217;s question</text><path d='M608 200.0H644' stroke='#a9a69c' stroke-width='1.25' fill='none' marker-end='url(#a)'/><rect x='648' y='180' width='88' height='40' rx='6' fill='none' stroke='#a9a69c' stroke-width='1.25' stroke-dasharray='4 3'/><text x='692.0' y='205' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>reply</text><text x='24' y='265' font-size='13' font-weight='600' fill='#1f1f1f' text-anchor='start'>Request 3</text><text x='24' y='281' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='start'>same text, new opening</text><rect x='192' y='248' width='160' height='40' rx='6' fill='#c4c2b8' fill-opacity='0.35' stroke='#a9a69c'/><text x='272.0' y='273' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>Different opening</text><rect x='360' y='248' width='240' height='40' rx='6' fill='#c4c2b8' fill-opacity='0.35' stroke='#a9a69c'/><text x='480.0' y='273' font-size='11.5' font-weight='400' fill='#1f1f1f' text-anchor='middle'>Company instructions</text><path d='M608 268.0H644' stroke='#a9a69c' stroke-width='1.25' fill='none' marker-end='url(#a)'/><rect x='648' y='248' width='88' height='40' rx='6' fill='none' stroke='#a9a69c' stroke-width='1.25' stroke-dasharray='4 3'/><text x='692.0' y='273' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>reply</text><rect x='24' y='331' width='24' height='16' rx='6' fill='#c4c2b8'