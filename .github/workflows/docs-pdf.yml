name: docs-pdf

# Builds docs/story.md and docs/whitepaper.md into PDFs whenever they or
# their figures change. On main, both are published to the "docs-latest"
# release at fixed URLs:
#   https://github.com/nvsrinivas/ifabsec/releases/download/docs-latest/story.pdf
#   https://github.com/nvsrinivas/ifabsec/releases/download/docs-latest/whitepaper.pdf
# On pull requests they are attached to the run as the "docs-pdf" artifact.
# No binary is committed to the repo.

on:
  push:
    branches: [main]
    paths:
      - docs/story.md
      - docs/whitepaper.md
      - docs/img/**
      - docs/demo/**
      - scripts/docs_pdf.py
      - .github/workflows/docs-pdf.yml
  pull_request:
    paths:
      - docs/story.md
      - docs/whitepaper.md
      - docs/img/**
      - docs/demo/**
      - scripts/docs_pdf.py
      - .github/workflows/docs-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc fonts-dejavu fonts-liberation

      - name: Build PDFs
        # ubuntu-latest ships Google Chrome, which prints the HTML to PDF.
        run: python3 scripts/docs_pdf.py build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: build/*.pdf
          retention-days: 90

  release:
    # Publish the PDFs from main to fixed release URLs.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-pdf
      - name: Update the docs-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete docs-latest --cleanup-tag --yes || true
          gh release create docs-latest story.pdf whitepaper.pdf \
            --target "$GITHUB_SHA" \
            --title "Story and white paper PDFs (latest)" \
            --notes "Built automatically from docs/story.md and docs/whitepaper.md at ${GITHUB_SHA::7}. Rebuilt on every change to either document or its figures." \
            --latest=false
